<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation Competition-26 · Participant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f5f7fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      max-width: 1100px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 0 32px 28px;
      overflow: hidden;
    }

    /* ================= HEADER ================= */
    .brand-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #0ea5e9 100%);
      margin: 0 -32px 24px;
      padding: 22px 32px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      border-radius: 36px 36px 0 0;
      box-shadow: 0 6px 18px -6px rgba(37, 99, 235, 0.45);
      position: relative;
      overflow: hidden;
    }
    .brand-header::after {
      content: "";
      position: absolute;
      right: -60px; top: -60px;
      width: 220px; height: 220px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .brand-left { display: flex; align-items: center; gap: 16px; z-index: 1; }
    .brand-logo {
      width: 64px; height: 64px;
      background: #ffffff;
      border: 2px solid rgba(255,255,255,0.55);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      padding: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .brand-logo img { height: 100%; width: auto; display: block; }
    .brand-title .hindi   { font-size: 1.25rem; font-weight: 700; color:#fff; letter-spacing:0.3px; }
    .brand-title .english { font-size: 0.95rem; font-weight: 500; color:#e0f2fe; text-transform:uppercase; letter-spacing:1.2px; margin-top:2px; }
    .brand-subtitle       { font-size: 0.78rem; color: #bae6fd; margin-top: 4px; letter-spacing: 0.4px; }

    /* ================= BILINGUAL ================= */
    .bilingual { display: flex; flex-direction: column; gap: 2px; line-height: 1.2; }
    .hindi    { font-size: 1.3rem; font-weight: 600; color: #1e293b; }
    .english  { font-size: 1rem; font-weight: 500; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ================= LOGIN ================= */
    .login-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px 24px;
      margin: 16px 0 24px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-weight: 600; font-size: 0.85rem;
      color: #334155; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .field input, .field select {
      padding: 12px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 16px;
      font-size: 1rem;
      background: #f8fafc;
      transition: 0.2s;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .emp-status { font-size: 0.8rem; margin-top: 4px; min-height: 16px; font-weight: 600; }
    .emp-status.checking  { color: #64748b; }
    .emp-status.ok        { color: #16a34a; }
    .emp-status.duplicate { color: #dc2626; }

    .btn-primary {
      background: #2563eb; color: white; border: none;
      padding: 16px 24px; border-radius: 60px;
      font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;
      cursor: pointer; transition: 0.2s; width: 100%;
      display: flex; justify-content: center; align-items: center;
      gap: 12px; margin-top: 8px;
    }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; transform: scale(1.01); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

    /* ================= QUIZ ================= */
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .timer-circle {
      background: #1e293b; color: white;
      border-radius: 40px; padding: 8px 18px;
      font-weight: 700; font-size: 1.2rem;
      display: flex; align-items: center; gap: 8px;
    }
    .progress-bar-bg {
      width: 100%; height: 10px;
      background: #e2e8f0; border-radius: 20px;
      overflow: hidden; margin: 12px 0 20px;
    }
    .progress-fill {
      height: 100%; width: 100%;
      background: #2563eb; transition: width 1s linear;
    }
    .question-text {
      font-size: 1.3rem; font-weight: 600; color: #0f172a;
      margin: 16px 0 24px; line-height: 1.4;
      padding: 12px 0 12px 20px;
      border-left: 6px solid #2563eb;
    }
    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 16px; margin: 20px 0 28px;
    }
    .option-btn {
      background: #f1f5f9; border: 2px solid #e2e8f0;
      border-radius: 24px; padding: 20px 16px;
      font-size: 1.05rem; font-weight: 500; text-align: left;
      cursor: pointer; transition: 0.15s;
      display: flex; align-items: center; gap: 12px;
      font-family: inherit;
      color: #1e293b;
    }
    .option-btn i {
      font-size: 1.2rem;
      color: #64748b;
      width: 24px;
      text-align: center;
      transition: color 0.15s, transform 0.15s;
      flex-shrink: 0;
    }
    .option-btn span { flex: 1; }
    .option-btn:hover:not(:disabled) { background: #e2e8f0; border-color: #94a3b8; }
    .option-btn.selected {
      background: #dbeafe;
      border-color: #2563eb;
      color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .option-btn.selected i {
      color: #2563eb;
      transform: scale(1.1);
    }
    .option-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* ================= COMPLETION ================= */
    .completion-box {
      text-align: center; padding: 48px 24px;
      background: #f0fdf4; border-radius: 32px;
      border: 2px solid #bbf7d0;
    }
    .completion-box i  { font-size: 4rem; color: #16a34a; margin-bottom: 20px; }
    .completion-box h2 { font-size: 2rem; margin-bottom: 8px; color: #14532d; }
    .completion-box p  { font-size: 1.2rem; color: #166534; }

    .hidden { display: none !important; }
    .mb-16  { margin-bottom: 16px; }

    @media (max-width: 700px) {
      .app-container { padding: 0 20px 20px; }
      .brand-header  { margin: 0 -20px 20px; padding: 18px 20px; }
      .login-grid, .options-grid { grid-template-columns: 1fr; }
      .brand-title .hindi { font-size: 1rem; }
      .brand-title .english { font-size: 0.8rem; }
      .brand-logo { width: 52px; height: 52px; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <!-- ================= HEADER ================= -->
  <div class="brand-header">
    <div class="brand-left">
      <div class="brand-logo">
       <!-- <img src="https://upload.wikimedia.org/wikipedia/commons/c/cc/SBI-logo.svg" alt="SBI"> -->
      </div>
      <div class="brand-title">
        <div class="hindi">अनुवाद प्रतियोगिता 2026 </div>
        <div class="english">Translation Competition 2026</div>
        <div class="brand-subtitle">Official Language Section</div>
      </div>
    </div>
  </div>

  <!-- ================= LOGIN ================= -->
  <div id="loginSection">
    <div class="bilingual mb-16">
      <span class="hindi">कृपया अपनी जानकारी भरें</span>
      <span class="english">Please enter your details</span>
    </div>
    <form id="loginForm">
      <div class="login-grid">
        <div class="field">
          <label>नाम / Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="field">
          <label>पद / Designation</label>
          <input type="text" id="designation" required>
        </div>
        <div class="field">
          <label>कर्मचारी संख्या / Emp.No. (7 digits)</label>
          <input type="text" id="empNo" required autocomplete="off"
                 inputmode="numeric" maxlength="7" pattern="[0-9]{7}"
                 placeholder="7-digit number">
          <div class="emp-status" id="empStatus"></div>
        </div>
        <div class="field">
          <label>मोबाइल / Mobile</label>
          <input type="tel" id="mobile" required maxlength="10" inputmode="numeric">
        </div>
        <div class="field">
          <label>मॉड्यूल / Module</label>
          <select id="module" required>
            <option value="">-- चुनें / Select --</option>
            <option value="KOZHIKODE">KOZHIKODE</option>
            <option value="THRISSUR">THRISSUR</option>
          </select>
        </div>
        <div class="field">
          <label>कार्यालय / Office</label>
          <select id="office" required>
            <option value="">-- चुनें / Select --</option>
            <option value="RBO-1">RBO-1</option>
            <option value="RBO-2">RBO-2</option>
            <option value="RBO-3">RBO-3</option>
            <option value="RBO-4">RBO-4</option>
            <option value="RBO-5">RBO-5</option>
            <option value="RBO-6">RBO-6</option>
            <option value="AO">AO</option>
          </select>
        </div>
        <div class="field">
          <label>मातृभाषा / Mother Tongue</label>
          <select id="motherTongue" required>
            <option value="">-- चुनें / Select --</option>
            <option value="MALAYALAM">MALAYALAM</option>
            <option value="HINDI">HINDI</option>
            <option value="OTHERS">OTHERS</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="startQuizBtn">
        <i class="fas fa-play"></i> प्रारंभ करें / Start Quiz
      </button>
    </form>
  </div>

  <!-- ================= QUIZ ================= -->
  <div id="quizSection" class="hidden">
    <div class="quiz-header">
      <div class="bilingual">
        <span class="hindi">प्रश्न <span id="currentQNo">1</span>/<span id="totalQNo">20</span></span>
        <span class="english">Question <span id="currentQNoEn">1</span>/<span id="totalQNoEn">20</span></span>
      </div>
      <div class="timer-circle">
        <i class="fas fa-hourglass-half"></i> <span id="timerDisplay">30</span>s
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressFill" style="width: 100%;"></div>
    </div>
    <div class="question-text" id="questionText">Loading question...</div>
    <div class="options-grid" id="optionsGrid"></div>
    <button class="btn-primary" id="nextBtn" disabled>
      <i class="fas fa-arrow-right"></i> अगला / Next
    </button>
  </div>

  <!-- ================= COMPLETION ================= -->
  <div id="completionSection" class="hidden">
    <div class="completion-box">
      <i class="fas fa-check-circle"></i>
      <h2>सफलतापूर्वक पूरा हुआ</h2>
      <p>Successfully completed, thank you for participation, results will be announced later.</p>
    </div>
  </div>

</div>

<script>
  // ⚠️ REPLACE with your deployed Web App URL
  const API_URL = 'https://script.google.com/macros/s/AKfycbyCS2NI7GMc2__yxtokn__S4-pk3nqhUwz1tZzD7TkuGelzWsgV_yrd5lx9nQZeI8TV/exec';
  const TIMER_SECONDS = 30;

  let currentUser          = null;
  let QUIZ_QUESTIONS       = [];
  let SESSION_ID           = null;
  let currentQuestionIndex = 0;
  let userAnswers          = [];
  let timerInterval        = null;
  let timeLeft             = TIMER_SECONDS;
  let totalTimeTaken       = 0;
  let quizActive           = false;
  let selectedOption       = null;
  let empCheckTimeout      = null;

  const loginSection      = document.getElementById('loginSection');
  const quizSection       = document.getElementById('quizSection');
  const completionSection = document.getElementById('completionSection');
  const loginForm         = document.getElementById('loginForm');
  const startQuizBtn      = document.getElementById('startQuizBtn');
  const questionText      = document.getElementById('questionText');
  const optionsGrid       = document.getElementById('optionsGrid');
  const nextBtn           = document.getElementById('nextBtn');
  const timerDisplay      = document.getElementById('timerDisplay');
  const progressFill      = document.getElementById('progressFill');
  const currentQNo        = document.getElementById('currentQNo');
  const totalQNo          = document.getElementById('totalQNo');
  const currentQNoEn      = document.getElementById('currentQNoEn');
  const totalQNoEn        = document.getElementById('totalQNoEn');
  const empNoInput        = document.getElementById('empNo');
  const empStatus         = document.getElementById('empStatus');

  function showSection(section) {
    [loginSection, quizSection, completionSection]
      .forEach(s => s.classList.add('hidden'));
    section.classList.remove('hidden');
  }

  function resetQuizState() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval        = null;
    currentQuestionIndex = 0;
    userAnswers          = [];
    totalTimeTaken       = 0;
    quizActive           = false;
    selectedOption       = null;
  }

  async function fetchConfig() {
    try {
      const res = await fetch(`${API_URL}?action=config`);
      return await res.json();
    } catch (err) {
      return { openTime: '00:00', closeTime: '23:59' };
    }
  }

  async function checkEmpExists(empNo) {
    try {
      const res  = await fetch(`${API_URL}?action=checkemp&empNo=${encodeURIComponent(empNo)}`);
      const data = await res.json();
      return data.exists === true;
    } catch (err) {
      return false;
    }
  }

  async function fetchQuestions() {
    const res  = await fetch(`${API_URL}?action=questions`);
    return await res.json();
  }

  async function gradeOnServer(sessionId, answers) {
    try {
      const url = `${API_URL}?action=grade&sessionId=${encodeURIComponent(sessionId)}` +
                  `&answers=${encodeURIComponent(JSON.stringify(answers))}`;
      const res = await fetch(url);
      return await res.json();
    } catch (err) {
      return { score: 0, total: 0 };
    }
  }

  async function saveResultToBackend(result) {
    try {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(result)
      });
    } catch (err) {
      console.error('Save failed', err);
    }
  }

  // ---------- Emp.No. live check (7 digits, digits only) ----------
  empNoInput.addEventListener('input', () => {
    // Strip non-digits
    empNoInput.value = empNoInput.value.replace(/[^0-9]/g, '');
    const val = empNoInput.value.trim();

    if (empCheckTimeout) clearTimeout(empCheckTimeout);
    empStatus.textContent = '';
    empStatus.className = 'emp-status';

    if (!val) return;

    if (!/^[0-9]{7}$/.test(val)) {
      empStatus.textContent = '⚠ Emp.No. must be exactly 7 digits.';
      empStatus.className = 'emp-status duplicate';
      return;
    }

    empStatus.textContent = 'Checking...';
    empStatus.classList.add('checking');

    empCheckTimeout = setTimeout(async () => {
      const exists = await checkEmpExists(val);
      if (exists) {
        empStatus.textContent = '⚠ This Emp.No. has already attempted the quiz.';
        empStatus.className = 'emp-status duplicate';
      } else {
        empStatus.textContent = '✓ Available';
        empStatus.className = 'emp-status ok';
      }
    }, 500);
  });

  function renderQuestion(index) {
    const q = QUIZ_QUESTIONS[index];
    if (!q) return;

    currentQNo.textContent   = index + 1;
    currentQNoEn.textContent = index + 1;
    questionText.textContent = q.question;
    optionsGrid.innerHTML    = '';

    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-btn';
      btn.innerHTML = `<i class="far fa-circle"></i> <span>${opt}</span>`;
      btn.addEventListener('click', () => handleOptionSelect(i, btn));
      optionsGrid.appendChild(btn);
    });

    selectedOption   = null;
    nextBtn.disabled = true;

    timeLeft = TIMER_SECONDS;
    timerDisplay.textContent = timeLeft;
    progressFill.style.width = '100%';

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft -= 1;
      timerDisplay.textContent = timeLeft;
      progressFill.style.width = `${(timeLeft / TIMER_SECONDS) * 100}%`;

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        if (quizActive) {
          if (userAnswers[currentQuestionIndex] === undefined) {
            userAnswers[currentQuestionIndex] = selectedOption;
          }
          totalTimeTaken += TIMER_SECONDS;
          currentQuestionIndex++;
          if (currentQuestionIndex < QUIZ_QUESTIONS.length) {
            renderQuestion(currentQuestionIndex);
          } else {
            quizActive = false;
            finishQuiz();
          }
        }
      }
    }, 1000);
  }

  function handleOptionSelect(optIndex, btnElement) {
    if (!quizActive) return;

    // Reset all options to empty circle, remove highlight
    document.querySelectorAll('.option-btn').forEach(b => {
      b.classList.remove('selected');
      const icon = b.querySelector('i');
      if (icon) icon.className = 'far fa-circle';
    });

    // Mark clicked option: filled dot + highlight
    btnElement.classList.add('selected');
    const icon = btnElement.querySelector('i');
    if (icon) icon.className = 'fas fa-circle';

    selectedOption   = optIndex;
    nextBtn.disabled = false;
  }

  nextBtn.addEventListener('click', () => {
    if (!quizActive || selectedOption === null) return;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (userAnswers[currentQuestionIndex] === undefined) {
      userAnswers[currentQuestionIndex] = selectedOption;
    }
    totalTimeTaken += (TIMER_SECONDS - timeLeft);
    currentQuestionIndex++;
    if (currentQuestionIndex < QUIZ_QUESTIONS.length) {
      renderQuestion(currentQuestionIndex);
    } else {
      quizActive = false;
      finishQuiz();
    }
  });

  async function finishQuiz() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    let score = 0;
    const total = QUIZ_QUESTIONS.length;

    try {
      const gradeData = await gradeOnServer(SESSION_ID, userAnswers);
      score = gradeData.score || 0;
    } catch (err) {}

    const result = {
      ...currentUser,
      score: score,
      totalQuestions: total,
      time: totalTimeTaken
    };

    await saveResultToBackend(result);
    showSection(completionSection);
    resetQuizState();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Open / close check
    const cfg   = await fetchConfig();
    const open  = cfg.openTime  || '00:00';
    const close = cfg.closeTime || '23:59';
    const now   = new Date();
    const nowStr = now.getHours().toString().padStart(2, '0') + ':' +
                   now.getMinutes().toString().padStart(2, '0');
    if (nowStr < open || nowStr > close) {
      alert(`Quiz opens at ${open} and closes at ${close}. Please try later.`);
      return;
    }

    currentUser = {
      name:         document.getElementById('name').value.trim(),
      designation:  document.getElementById('designation').value.trim(),
      empNo:        empNoInput.value.trim(),
      mobile:       document.getElementById('mobile').value.trim(),
      module:       document.getElementById('module').value,
      office:       document.getElementById('office').value,
      motherTongue: document.getElementById('motherTongue').value
    };

    // Basic required field check
    if (!currentUser.name || !currentUser.designation || !currentUser.empNo ||
        !currentUser.mobile || !currentUser.module || !currentUser.office ||
        !currentUser.motherTongue) {
      alert('Please fill all fields.');
      return;
    }

    // Emp.No. must be exactly 7 digits
    if (!/^[0-9]{7}$/.test(currentUser.empNo)) {
      alert('Employee Number must be exactly 7 digits.');
      empStatus.textContent = '⚠ Emp.No. must be exactly 7 digits.';
      empStatus.className = 'emp-status duplicate';
      return;
    }

    // Mobile must be 10 digits
    if (!/^[0-9]{10}$/.test(currentUser.mobile)) {
      alert('Mobile number must be exactly 10 digits.');
      return;
    }

    startQuizBtn.disabled = true;
    startQuizBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

    const alreadyExists = await checkEmpExists(currentUser.empNo);
    if (alreadyExists) {
      alert('⚠ This Employee Number has already attempted the quiz.\n\nOnly one submission per participant is allowed.');
      empStatus.textContent = '⚠ This Emp.No. has already attempted the quiz.';
      empStatus.className = 'emp-status duplicate';
      startQuizBtn.disabled  = false;
      startQuizBtn.innerHTML = '<i class="fas fa-play"></i> प्रारंभ करें / Start Quiz';
      return;
    }

    startQuizBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading questions...';

    try {
      const data = await fetchQuestions();
      if (!data.questions || data.questions.length === 0) {
        alert('Could not load questions. Please try again later.');
        return;
      }

      QUIZ_QUESTIONS = data.questions;
      SESSION_ID     = data.sessionId;
      totalQNo.textContent   = QUIZ_QUESTIONS.length;
      totalQNoEn.textContent = QUIZ_QUESTIONS.length;

      resetQuizState();
      quizActive           = true;
      showSection(quizSection);
      currentQuestionIndex = 0;
      renderQuestion(0);

    } catch (err) {
      alert('Error loading questions. Please try again.');
    } finally {
      startQuizBtn.disabled  = false;
      startQuizBtn.innerHTML = '<i class="fas fa-play"></i> प्रारंभ करें / Start Quiz';
    }
  });

  showSection(loginSection);
  window.addEventListener('beforeunload', () => {
    if (timerInterval) clearInterval(timerInterval);
  });
</script>
</body>
</html>
